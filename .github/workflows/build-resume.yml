name: Build Resume

on:
    push:
        paths:
            - 'robotices.tex'
            - 'software.tex'
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Compile robotics resume
              uses: xu-cheng/latex-action@v3
              with:
                root_file: robotics.tex
                working_directory: .
            
            - name: Compile software resume
              uses: xu-cheng/latex-action@v3
              with:
                root_file: software.tex
                working_directory: .
            
            - name: Checkout sunnoah.ca repo
              uses: actions/checkout@v4
              with:
                repository: LegendaryArk/sunnoah.ca
                token: ${{ secrets.WEBSITE_REPO_TOKEN }}
                path: sunnoah.ca-repo
            
            - name: Copy PDFs to sunnoah.ca repo
              run: |
                mkdir -p sunnoah.ca-repo/public/resumes
                rm -f sunnoah.ca-repo/public/resumes/noah_sun_resume_robotics.pdf
                rm -f sunnoah.ca-repo/public/resumes/noah_sun_resume_software.pdf
                cp robotics.pdf sunnoah.ca-repo/public/resumes/noah_sun_resume_robotics.pdf
                cp software.pdf sunnoah.ca-repo/public/resumes/noah_sun_resume_software.pdf
                echo "{\"last_updated\": \"$(date -u +'%Y-%m-%d')\"}" > sunnoah.ca-repo/public/resumes/last_updated.json
            
            - name: Commit and push to sunnoah.ca repo
              working-directory: sunnoah.ca-repo
              run: |
                git config user.name "github-actions"
                git config user.email "actions@github.com"
                git add public/resumes/
                git diff --staged --quiet || git commit -m "Auto-update resume PDFs"
                git push
            
            - name: Setup Node.js for website
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: sunnoah.ca-repo/package-lock.json
            
            - name: Deploy website
              working-directory: sunnoah.ca-repo
              env:
                GH_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
              run: |
                rm -rf node_modules/.cache/gh-pages
                git remote set-url origin https://github.com

                npm ci
                npm run deploy
            
            - name: Send resume PDFs via ntfy
              if: success()
              run: |
                curl -T robotics.pdf \
                        -H "Filename: Noah_Sun_Resume_Robotics.pdf" \
                        -H "Title: Resume Exported" \
                        -H "Message: Latest resume exported successfully." \
                        ntfy.sh/resume-exports
                curl -T software.pdf \
                        -H "Filename: Noah_Sun_Resume_Software.pdf" \
                        -H "Title: Resume Exported" \
                        -H "Message: Latest resume exported successfully." \
                        ntfy.sh/resume-exports